name: android-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The action's default package list includes the legacy "tools" package,
      # which no longer exists in the SDK repository and fails the step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew :core:domain:test testDebugUnitTest :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: my-android-testflight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
