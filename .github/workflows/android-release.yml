name: android-release

# Builds a versioned set of release artifacts: one APK per ABI, a universal APK, and the Android
# App Bundle. Every run is marked with a version: the tag is created (when missing) and a GitHub
# release carries the files plus checksums.
#
# A push to main only publishes when appVersionName in gradle.properties differs from the latest
# release tag; pushes that leave the version alone run android-ci but are skipped here. Pushing a
# tag (v1.2.3) or running the workflow by hand always publishes. A version with a pre-release
# suffix (v1.2.3-beta.1) is published as a pre-release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, MAJOR.MINOR.PATCH (defaults to appVersionName in gradle.properties)"
        required: false
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ABIS: arm64-v8a,armeabi-v7a,x86_64
  BUILD_TOOLS: "37.0.0"

jobs:
  # Decides whether this run should publish at all. A main push is only a release when the
  # version in gradle.properties moved past the latest v* tag; anything else is ordinary code
  # that android-ci already tested and built.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare appVersionName with the latest release tag
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '[:space:]' | head -n1)"
          if [ -z "$current" ]; then
            echo "::error::appVersionName is missing from gradle.properties."
            exit 1
          fi
          # Tag pushes and manual runs always publish; only ordinary main pushes are gated.
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $current (tag push or manual run)."
            exit 0
          fi
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "No previous release tag; releasing $current."
            exit 0
          fi
          last_version="$(git show "${last_tag}:gradle.properties" 2>/dev/null \
            | sed -n 's/^appVersionName=//p' | tr -d '[:space:]' | head -n1 || true)"
          if [ "$current" = "$last_version" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "appVersionName is still $current (latest release $last_tag); skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "appVersionName changed ${last_version:-<unknown>} -> $current; releasing."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The action's default package list includes the legacy "tools" package,
      # which no longer exists in the SDK repository and fails the step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.2" "build-tools;${BUILD_TOOLS}"

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          default_version="$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '[:space:]' | head -n1)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # The gate only lets a main push through when appVersionName changed, so this is a
            # genuinely new version. If its tag already exists (re-run, manual dispatch), the tag
            # and release are reused and their assets replaced, keeping download links stable.
            version="$default_version"
          else
            version="${INPUT_VERSION:-$default_version}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::No version given. Pass a version to the workflow or set appVersionName in gradle.properties."
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "::error::Version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          # versionCode must grow with every release so devices upgrade instead of failing.
          version_code="$(git rev-list --count HEAD)"
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "version_code=$version_code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (versionCode $version_code, tag v$version)"

      # Optional. Create repository secrets ANDROID_KEYSTORE_BASE64 (base64 of a .jks),
      # ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign with your own
      # key. Without them the artifacts are debug-signed, which is installable for testing only.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the repository keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; release artifacts will be debug-signed."
          fi

      # Publishing is automatic on main, so unit tests gate the release: a failing test stops the
      # job before anything is uploaded.
      #
      # The AAB is built first with ABI splits off. AGP 9 cannot shrink resources for an app bundle
      # while split APKs are produced in the same build ("Multiple shrunk-resources files found"),
      # so the bundle and the split APKs are separate Gradle invocations.
      - name: Test and build AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :core:domain:test testDebugUnitTest :app:bundleRelease \
            --no-daemon --stacktrace \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappAbiSplits=false

      - name: Build split APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappAbiSplits=true \
            -PappAbiFilters="${ABIS}" \
            -PappUniversalApk=true

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"          # app-arm64-v8a-release
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/MyTestflight-${version}-${abi}.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab "dist/MyTestflight-${version}.aab"
          ( cd dist && sha256sum ./*.apk ./*.aab | sed 's|\./||' > SHA-256SUMS.txt )
          ls -l dist
          cat dist/SHA-256SUMS.txt

      - name: Verify signatures
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      # Release builds are R8-minified, so a crash trace needs this file to map back to source.
      # It stays a workflow artifact rather than a release asset so it is not published publicly.
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-mapping-${{ steps.version.outputs.version }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Tag the version
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; reusing it."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$tag" -m "MyTestflight Android $tag"
            git push origin "$tag"
          fi

      # Builds the release body from conventional commits since the previous release, plus a
      # hidden JSON block the Android app parses for its update prompt. The current tag may
      # already exist when main republishes a version, so peel it to find the real previous tag.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            prev_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          else
            prev_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          echo "Previous release tag: ${prev_tag:-<none>}"
          node scripts/generate-release-notes.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --tag "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --from "$prev_tag" \
            --to HEAD \
            --dist dist \
            --out "$RUNNER_TEMP/release-notes.md"
          echo "file=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          notes_file="${{ steps.notes.outputs.file }}"
          flags=(--title "MyTestflight Android ${{ steps.version.outputs.version }}")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            flags+=(--draft)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating its notes and replacing assets."
            gh release edit "$tag" --notes-file "$notes_file" "${flags[@]}"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --notes-file "$notes_file" "${flags[@]}"
          fi
