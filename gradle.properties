org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Bump appVersionName to cut a new release; the release workflow reads it and tags v<version>.
# Both can be overridden per build with -PappVersionName / -PappVersionCode.
appVersionName=0.1.0
appVersionCode=1
